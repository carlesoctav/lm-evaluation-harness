task: olmo3_bbh
dataset_path: lukaemon/bbh
output_type: generate_until
test_split: test
doc_to_text: "{{input}}"
doc_to_target: "{{target}}"
num_fewshot: 0
generation_kwargs:
  until:
    - "\n\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 64
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
