# PopQA - Factual QA (minimal prompt)
task: olmo3_popqa
dataset_path: akariasai/PopQA
output_type: generate_until
test_split: test
doc_to_text: "{{question}}"
doc_to_target: "{{obj}}"
num_fewshot: 0
generation_kwargs:
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 64
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
