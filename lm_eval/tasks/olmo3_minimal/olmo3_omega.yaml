# OMEGA Math - Minimal prompt
task: olmo3_omega
dataset_path: allenai/OMEGA
output_type: generate_until
test_split: test
doc_to_text: "{{problem}}"
doc_to_target: "{{answer}}"
num_fewshot: 0
generation_kwargs:
  until:
    - "\n\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1024
filter_list:
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "(-?[$0-9.,]+)|(-?[0-9]+)"
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
