# AGI-Eval template - Generate-based with minimal prompt
# The query field already contains question + choices, we just strip the "A: Among..." suffix
output_type: generate_until
test_split: test
doc_to_text: "{{query.split('A: Among')[0].strip()}}"
doc_to_target: "{{gold}}"
num_fewshot: 0
generation_kwargs:
  until:
    - "\n"
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 64
filter_list:
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: 0
        regex_pattern: "\\b([A-E])\\b"
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
metadata:
  version: 1.0
