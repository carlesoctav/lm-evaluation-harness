# AGI-Eval template - Generate-based with minimal prompt
# The query field already contains question + choices, we just strip the "A: Among..." suffix
output_type: generate_until
test_split: test
doc_to_text: |
  {{query.split('A: Among')[0].strip()}}
  
  Follow this format:
  Reasoning:
  <step-by-step reasoning>
  Answer:
  <letter>
doc_to_target: "{{['A', 'B', 'C', 'D', 'E'][gold[0]]}}"
num_fewshot: 0
generation_kwargs:
  until:
    - "</s>"
    - "<|im_end|>"
    - "<|eot_id|>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1024
  structured_outputs:
    regex: 'Reasoning:\n(.|\n)*?Answer:\n[A-E]'
filter_list:
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: 0
        regex_pattern: 'Answer:\n([A-E])'
      - function: "take_first"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
metadata:
  version: 1.0
